name: publish

# Publish to PyPI when a version tag is pushed. Uses PyPI Trusted Publishing (OIDC) —
# no API token stored anywhere. Release flow: bump version.py + CHANGELOG (PR → merge),
# then `git tag v0.1.2 && git push origin v0.1.2`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # REQUIRED for OIDC trusted publishing (no token)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify the tag matches version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/aipsy_bench/version.py)"
          echo "tag=$TAG  version.py=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag v$TAG does not match version.py $VER"; exit 1; }

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing / OIDC)
        run: uv publish --trusted-publishing always
