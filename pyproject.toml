[project]
name = "aipsy-bench"
dynamic = ["version"]                # single source of truth: src/aipsy_bench/version.py
description = "Open-source psychological-safety benchmark for conversational AI (Inspect AI based)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Keido Labs", email = "michael@keidolabs.com" }]
keywords = [
    "ai-safety", "psychological-safety", "llm-evaluation", "llm-as-judge",
    "benchmark", "inspect-ai", "conversational-ai",
]
# No `License ::` trove classifier — the SPDX `license` field above is the single source
# (PyPI/twine reject or warn on declaring both).
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.235",
    "httpx",              # async local-judge transport (also an inspect-ai dep; declared as we import it)
    "huggingface-hub>=0.20",   # `judge pull` for the default offline local judge
    "openai",                  # OpenAI frontier judge · openai/* & ollama/<model> targets
    "anthropic",               # Anthropic frontier judge · claude-* targets
    "google-genai",            # Google frontier judge · gemini-* targets
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
aipsy-bench = "aipsy_bench.cli:main"

[project.urls]
Homepage = "https://www.keidolabs.com"
Repository = "https://github.com/keidolabs/aipsy-bench"
Changelog = "https://github.com/keidolabs/aipsy-bench/blob/main/CHANGELOG.md"

# No optional-dependencies: everything ships in the base install — one `uv tool install aipsy-bench`
# (or `pip install aipsy-bench`) gets the local judge + all frontier providers. The ~27 GB judge
# MODEL is a separate `judge pull` via Ollama (not a pip dep); `doctor`/`init` check hardware + which
# API keys are present and steer you to the right lane at runtime.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aipsy_bench/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aipsy_bench"]

[tool.hatch.build.targets.wheel.force-include]
"data/v1" = "aipsy_bench/data/v1"

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
