[project]
name = "aipsy-bench"
version = "0.1.0"
description = "Open-source psychological-safety benchmark for conversational AI (Inspect AI based)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.235",
    "httpx",              # async local-judge transport (also an inspect-ai dep; declared as we import it)
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
aipsy-bench = "aipsy_bench.cli:main"

[project.optional-dependencies]
openai = ["openai"]
anthropic = ["anthropic"]
google = ["google-genai"]
# `local` covers a fully-local run: `huggingface-hub` for `judge pull`, plus the `openai`
# client which Inspect uses to drive a local `ollama/<model>` TARGET. (The local JUDGE itself
# is stdlib — native Ollama /api/chat — and needs no extra; the openai client is for the target.)
local = ["huggingface-hub>=0.20", "openai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipsy_bench"]

[tool.hatch.build.targets.wheel.force-include]
"data/v1" = "aipsy_bench/data/v1"

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
