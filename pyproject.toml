[project]
name = "aipsy-bench"
version = "0.1.0"
description = "Open-source psychological-safety benchmark for conversational AI (Inspect AI based)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.235",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
aipsy-bench = "aipsy_bench.cli:main"

[project.optional-dependencies]
openai = ["openai"]
anthropic = ["anthropic"]
google = ["google-genai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipsy_bench"]

[tool.hatch.build.targets.wheel.force-include]
"data/v1" = "aipsy_bench/data/v1"

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
